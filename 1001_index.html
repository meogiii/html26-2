<!DOCTYPE html>
<html lang='ko'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>1001_폼 연습</title>
    <link rel='stylesheet' href='main.css'>
</head>
<body>
    <!-- form 태그 -->
     <form action="어디로보낼지" method="어떻게보낼지"></form>
     <form action="어디로보낼지" method="get"></form>
     <form action="어디로보낼지" method="post"></form>
     

    <!-- input 태그 --><hr>
     <form action="" method=""> 
        <input type="text" name="name" placeholder="이름을 입력하세요."> <br>
        <input type="password" name="userPw" placeholder="비밀번호를 입력하세요."> <br>
        <input type="email" name="email" placeholder="이메일을 입력하세요."> <br>
        <input type="tel" name="tel" placeholder="전화번호를 입력하세요."> <br>
        <input type="number" name="num" placeholder="숫자를 입력하세요."> <br>
        <input type="date" name="date" placeholder="날짜를 입력하세요."> <br>
        <input type="search" name="search" placeholder="검색어를 입력하세요."> <br>


     <!-- 선택형 태그 --><hr>
      <input type="checkbox">
      <input type="radio"> <br><br>

      <b>취미를 모두 선택하시오</b><br>
        <input type="checkbox" name="hobby" value="helth">헬스<br>
        <input type="checkbox" name="hobby" value="basketball">농구<br>
        <input type="checkbox" name="hobby" value="billiards">당구<br>
        <input type="checkbox" name="hobby" value="music">음악<br>
        <input type="checkbox" name="hobby" value="soccer">축구<br>
      
      <b>성별을 선택하시오</b><br>
        <input type="radio" name="gender" value="male">남자<br>
        <input type="radio" name="gender" value="female">여자<br>
        <input type="file"><br><br>

    <!-- 버튼 태그 --><hr>
        <p><input type="submit"><br> 
        <input type="reset"><br>
        <input type="button"><br><br></p>
    </form>

    <!-- 파일 업로드--><hr>
     <form action="" method="post" enctype="multipart/form-data">
        <input type="file">
     </form><br><br>

    <!-- 로그인 기능 만들기 --><hr>
     <form action="" method="post">
        <input type="text" name="userId" placeholder="아이디를 입력하세요."> <br>
        <input type="password" name="userPw" placeholder="비밀번호를 입력하세요."> <br>
        <input type="checkbox" name="login" value="keepLogin">로그인 상태 유지<br>
        <input type="submit" value="로그인"><br>
     </form><br><br>
     
     

     <!-- 회원가입 기능 만들기 --><hr>
   <form action="" method="post">
    <fieldset>
        <legend>회원가입</legend>
        <label for="email" >이메일</label>
        <input type="email" id="email" name="email" placeholder="이메일을 입력하세요."required>
    <br>
        <label for="pw">비밀번호</label>
        <input type="password" id="pw" name="pw" placeholder="비밀번호를 입력하세요."required>
    </fieldset>
    <br>
    <fieldset>
        <legend>개인정보</legend>
        <select name="region">
            <option value="seoul">서울</option>
            <option value="busan">부산</option>
        </select>
    <br>
        <textarea name="intro" rows="4" placeholder="자기소개를 입력하세요.(50자 이내)" maxlength="50"></textarea>
    <br>
    </fieldset>
    <input type="checkbox" name="agree"> 약관에 동의합니다
    <input type="submit" value="회원가입">
</form>
<br><br>

    <!-- 휴대폰 번호: 010-1234-5678 형식 --> <hr>
<form action="" method="post"> 
    <input type="tel" name="userTel"
       placeholder="010-1234-5678"
       pattern="01[0-9]-[0-9]{3,4}-[0-9]{4}"
       title="010-1234-5678 형식으로 입력해주세요">
<br>
    <!-- 우편번호: 숫자 5자리 -->
    <input type="text" name="zipCode"
       placeholder="12345"
       pattern="[0-9]{5}"
       title="숫자 5자리로 입력해주세요">   
    <input type="submit" value="제출">
</form>
<hr><br>
<!-- label · textarea · select -->
 <label for="email">이메일</label>
 <input type="email" id="email" name="email">
<!-- label의 for 값과 input의 id 값이 "email"로 같아야 서로 연결됩니다 -->

<select name="region">
    <option value="seoul">서울</option>
    <option value="busan">부산</option>
    <option value="anyang">안양</option>
    <option value="gunpo">군포</option>
</select>
<!-- 화면엔 "서울"이 보이지만, 서버에는 region=seoul 로 전달됩니다 -->
<hr><br>
<!-- 회원가입 창 -->
 <h3>회원가입</h5>
 <form action="" method="post">
    <label for="email">이메일</label>
    <input type="email" id="email" name="email" placeholder="이메일을 입력하세요." ><br>
    <br>
    <select name="region">
      <option value="seoul">서울</option>
      <option value="busan">부산</option>
      <option value="anyang">안양</option>
      <option value="gunpo">군포</option>
    </select>
    <br><br>
    <textarea name="intro" rows="5" cols="40" placeholder="자기소개를 입력하세요.(50자 이내)" maxlength="50"
    ></textarea><br>
    <input type="checkbox" name="agree" required> 약관에 동의합니다.
    <input type="submit" value="회원가입">
    <hr>
    <label for="email">이메일</label>
    <input type="email" id="email" name="email">
</form>


</body>
</html>
