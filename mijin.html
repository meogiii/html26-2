<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>🚨 개븅신 박준서 전용 긴급 설문조사 🚨</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        form { display: inline-block; text-align: left; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); width: 350px; }
        legend { font-weight: bold; font-size: 1.2em; color: #d9534f; }
        .submit-btn { width: 100%; padding: 12px; background: #d9534f; color: white; border: none; font-weight: bold; font-size: 1.1em; cursor: pointer; border-radius: 5px; margin-top: 10px; }
        .submit-btn:hover { background: #c9302c; }
    </style>
</head>
<body>

    <h2>⚠️ 개븅신  박준서 전용 진실의 방 ⚠️</h2>
    
    <!-- 제출 버튼을 누르면 경고창이 뜨도록 action에 자바스크립트를 넣었습니다 -->
    <form action="javascript:alert('완료되었습니다. 이제부터 박준서는 김대기의 평생 노예입니다. (취소 불가)')" method="post">
        
        <fieldset>
            <legend>본인 확인</legend>
            <label for="name">이름:</label>
            <!-- readonly 속성으로 이름을 수정하지 못하게 막아버림 -->
            <input type="text" id="name" value="박준서" readonly style="background-color: #eee;"><br><br>
            
            <label for="iq">현재 IQ (양심껏 입력):</label>
            <!-- max 속성으로 50 이상은 입력도, 제출도 안 되게 만듦 -->
            <input type="number" id="iq" max="50" placeholder="50 이상 입력 불가" title="50 이상은 칠 수 없습니다" required><br>
        </fieldset>
        <br>

        <fieldset>
            <legend>객관적인 사실 인정</legend>
            <b>김대기는 나보다 훨씬 잘생겼다.</b><br>
            <!-- 다른 선택지 없이 무조건 칭찬만 강요 -->
            <input type="radio" name="handsome" value="yes" required> 매우 인정한다<br>
            <input type="radio" name="handsome" value="absolutely" required> 반박할 수 없는 팩트다<br><br>

            <b>나(박준서)의 숨겨진 취미는? (모두 선택)</b><br>
            <!-- checked 속성으로 이미 체크되어 있게 만듦 -->
            <input type="checkbox" name="hobby" value="crying" checked> 세아생각하기<br>
            <input type="checkbox" name="hobby" value="fool" checked> 강미진 생각하기<br>
            <input type="checkbox" name="hobby" value="begging" checked> 김대기한테 밥 사달라고 조르기<br>
        </fieldset>
        <br>

        <fieldset>
            <legend>반성문 작성</legend>
            <textarea name="apology" rows="4" placeholder="그동안의 잘못을 50자 이내로 서술하시오." maxlength="50" style="width:90%;" required></textarea>
        </fieldset>
        <br>

        <input type="checkbox" name="agree" required> (필수) 위 내용을 모두 인정하며, 앞으로 김대기의 말씀에 절대 복종할 것을 맹세합니다.<br>
        
        <input type="submit" value="📝 제출" class="submit-btn">
    </form>

</body>
</html>
